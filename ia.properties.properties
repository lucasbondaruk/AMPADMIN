# Copiá este archivo como "ia.properties" (en la misma carpeta que build.xml).
# ia.properties NO se sube a GitHub (está en .gitignore).

# ---------------- Opción recomendada: Ollama (gratis, local, sin internet) ----------------
# 1) Instalar https://ollama.com
# 2) Bajar un modelo una sola vez (elegí según la RAM de la PC):
#      16 GB o más:  ollama pull qwen3:8b
#      8 GB:         ollama pull qwen3:4b
proveedor=ollama
ollama.url=http://localhost:11434
ollama.modelo=qwen3:8b
# Baja = respuestas estables y sin inventar (0 a 1)
ollama.temperatura=0.2
# Tokens de contexto: el informe usa ~4.000; con menos Ollama corta datos sin avisar
ollama.contexto=8192
# qwen3 "piensa" antes de responder: false lo hace más rápido. Si tu modelo no lo soporta, borrá la línea.
ollama.pensar=false

# ---------------- Opción paga: Claude (API de Anthropic) ----------------
#proveedor=claude
#claude.apiKey=PEGAR_ACA_TU_API_KEY
#claude.modelo=claude-haiku-5-5
